<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>Awardees depth backdrop</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; background: #fafcff; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: radial-gradient(ellipse at 50% 46%, #ffffff 0%, #f5f9ff 42%, #d9e9fa 100%); }
      #rays { position: absolute; left: 50%; top: 46%; width: 1700px; height: 1700px; margin-left: -850px; margin-top: -850px; border-radius: 50%; background: repeating-conic-gradient(from 0deg, rgba(227,181,74,0) 0deg, rgba(227,181,74,0.3) 5deg, rgba(227,181,74,0) 13deg, rgba(227,181,74,0) 30deg); opacity: 0.5; }
      #glow { position: absolute; left: 50%; top: 46%; width: 880px; height: 880px; margin-left: -440px; margin-top: -440px; border-radius: 50%; background: radial-gradient(circle, rgba(255,252,238,0.95) 0%, rgba(245,210,125,0.3) 34%, rgba(255,255,255,0) 64%); }
      .layer { position: absolute; left: -10%; top: 0; width: 120%; height: 100%; }
      .dot { position: absolute; border-radius: 50%; }
      /* Three depths: far is small and sharp, near is large and soft. */
      #far .dot { background: rgba(227,181,74,0.75); }
      #mid .dot { background: radial-gradient(circle, rgba(236,203,114,0.85) 0%, rgba(236,203,114,0) 70%); }
      #near .dot { background: radial-gradient(circle, rgba(245,225,164,0.6) 0%, rgba(245,225,164,0) 68%); filter: blur(6px); }
      .dot--blue { background: radial-gradient(circle, rgba(90,159,224,0.6) 0%, rgba(90,159,224,0) 70%) !important; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="awardees" data-start="0" data-width="1280" data-height="720" data-duration="12">
      <div id="rays"></div>
      <div id="glow"></div>
      <div class="layer" id="far"></div>
      <div class="layer" id="mid"></div>
      <div class="layer" id="near"></div>
    </div>
    <script>
      // Deterministic dot fields: fixed seed, no Math.random, so every render matches.
      function rng(seed) { return function () { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rand = rng(20261023);
      function fill(id, count, min, max) {
        const host = document.getElementById(id);
        const out = [];
        for (let i = 0; i < count; i++) {
          const d = document.createElement("span");
          d.className = "dot" + (i % 7 === 0 ? " dot--blue" : "");
          const size = min + rand() * (max - min);
          d.style.width = size + "px";
          d.style.height = size + "px";
          d.style.left = (rand() * 100) + "%";
          d.style.top = (rand() * 100) + "%";
          host.appendChild(d);
          out.push({ el: d, delay: rand() * 5 });
        }
        return out;
      }
      const far = fill("far", 34, 3, 6);
      const mid = fill("mid", 20, 14, 30);
      const near = fill("near", 9, 70, 150);

      const tl = gsap.timeline({ paused: true });
      // Rays turn 30 degrees. The pattern repeats every 30 degrees, so the last frame matches the first.
      tl.fromTo("#rays", { rotation: 0 }, { rotation: 30, duration: 12, ease: "none" }, 0);
      tl.fromTo("#glow", { scale: 0.94, opacity: 0.75 }, { scale: 1.05, opacity: 1, duration: 6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      // Parallax: each depth layer sways a different distance, near moves most. Each returns to its start.
      tl.fromTo("#far", { xPercent: -1 }, { xPercent: 1, duration: 6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.fromTo("#mid", { xPercent: -3 }, { xPercent: 3, duration: 6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.fromTo("#near", { xPercent: -7 }, { xPercent: 7, duration: 6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      // Dots breathe in brightness, staggered, each finishing inside the loop.
      far.concat(mid, near).forEach(function (p) {
        tl.fromTo(p.el, { opacity: 0.25 }, { opacity: 1, duration: 3, ease: "sine.inOut", yoyo: true, repeat: 1 }, p.delay);
      });
      window.__timelines["awardees"] = tl;
    </script>
  </body>
</html>
