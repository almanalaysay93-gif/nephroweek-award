<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Nephrology Nurses Week hero loop</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <style>
      html, body { margin: 0; background: #fafcff; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #ffffff 0%, #eaf3fd 55%, #cfe3f7 100%); }
      .layer { position: absolute; inset: -10%; pointer-events: none; }
      .blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.55; }
      .blob--blue { width: 900px; height: 900px; left: -10%; top: -20%; background: radial-gradient(circle, #5a9fe0 0%, rgba(90,159,224,0) 70%); }
      .blob--gold { width: 760px; height: 760px; right: -8%; bottom: -25%; background: radial-gradient(circle, rgba(227,181,74,0.55) 0%, rgba(227,181,74,0) 68%); }
      .blob--sky { width: 700px; height: 700px; right: 10%; top: -15%; background: radial-gradient(circle, #93c0ec 0%, rgba(147,192,236,0) 70%); }
      .sweep { position: absolute; top: -20%; left: -40%; width: 60%; height: 140%; background: linear-gradient(105deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.7) 45%, rgba(227,181,74,0.25) 55%, rgba(255,255,255,0) 100%); transform: skewX(-12deg); }
      .spark { position: absolute; border-radius: 50%; background: #e3b54a; box-shadow: 0 0 10px 2px rgba(227,181,74,0.5); }
      .spark--blue { background: #5a9fe0; box-shadow: 0 0 10px 2px rgba(90,159,224,0.45); }
      .seal { position: absolute; left: 50%; top: 50%; width: 360px; height: auto; margin-left: -180px; margin-top: -240px; opacity: 0.09; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="hero" data-start="0" data-width="1920" data-height="1080" data-duration="12">
      <div class="layer" id="bg">
        <div class="blob blob--blue" id="b1"></div>
        <div class="blob blob--sky" id="b2"></div>
        <div class="blob blob--gold" id="b3"></div>
      </div>
      <div class="sweep" id="sweep"></div>
      <img class="seal" id="seal" src="assets/spmc-seal-400.webp" alt="" />
      <div id="sparks"></div>
    </div>
    <script>
      // Deterministic particle field: fixed seed, no Math.random, so every render matches.
      function rng(seed) { return function () { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const rand = rng(20260);
      const host = document.getElementById("sparks");
      const sparks = [];
      for (let i = 0; i < 46; i++) {
        const s = document.createElement("span");
        s.className = "spark" + (i % 5 === 0 ? " spark--blue" : "");
        const size = 3 + rand() * 6;
        s.style.width = size + "px";
        s.style.height = size + "px";
        s.style.left = (rand() * 100) + "%";
        s.style.top = (rand() * 100) + "%";
        host.appendChild(s);
        sparks.push({ el: s, dx: (rand() - 0.5) * 160, dy: -40 - rand() * 120, delay: rand() * 4 });
      }

      const tl = gsap.timeline({ paused: true });
      // Blobs drift in a closed loop: each tween returns to its start by the end of the 12 s timeline.
      tl.to("#b1", { x: 180, y: 120, duration: 6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.to("#b2", { x: -160, y: 90, duration: 6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.to("#b3", { x: -140, y: -110, duration: 6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      // Light sweep crosses the frame twice.
      tl.fromTo("#sweep", { xPercent: 0 }, { xPercent: 340, duration: 6, ease: "power1.inOut", yoyo: true, repeat: 1 }, 0);
      // Seal breathes and tilts slightly.
      tl.fromTo("#seal", { rotation: -3, scale: 0.97 }, { rotation: 3, scale: 1.03, duration: 6, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      // Sparks rise and fade, staggered from a fixed seed. Each one ends transparent and at its start point.
      sparks.forEach(function (p) {
        tl.fromTo(p.el, { x: 0, y: 0, opacity: 0 }, { x: p.dx, y: p.dy, opacity: 0.85, duration: 4, ease: "sine.out", yoyo: true, repeat: 1 }, p.delay);
      });
      window.__timelines["hero"] = tl;
    </script>
  </body>
</html>
